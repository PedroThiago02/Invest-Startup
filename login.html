<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Invest Equilíbrio - Entrar / Cadastrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card-container {
      perspective: 1000px;
    }
    .card {
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body class="bg-purple-800 flex items-center justify-center min-h-screen font-sans relative">

  <button onclick="history.back()" class="absolute top-6 left-6 text-white bg-yellow-400 hover:bg-yellow-300 transition-colors px-4 py-2 rounded-full font-semibold shadow-lg">
    ← Voltar
  </button>

  <div class="card-container w-full max-w-md h-[500px]">
    <div id="card" class="card relative w-full h-full">

      <div class="card-face glass absolute w-full h-full rounded-3xl flex flex-col items-center justify-center px-10">
        <h2 class="text-3xl font-bold text-white mb-6">Bem-vindo!</h2>
        <form class="w-full space-y-4">
          <input type="email" placeholder="E-mail" class="w-full px-4 py-3 rounded-xl border border-purple-300 focus:ring-2 focus:ring-yellow-400 outline-none bg-white bg-opacity-10 text-white placeholder-gray-300" />
          <input type="password" placeholder="Senha" class="w-full px-4 py-3 rounded-xl border border-purple-300 focus:ring-2 focus:ring-yellow-400 outline-none bg-white bg-opacity-10 text-white placeholder-gray-300" />
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <input type="checkbox" id="remember" class="text-yellow-400">
              <label for="remember" class="text-white">Lembrar-me</label>
            </div>
            <a href="#" class="text-yellow-400 hover:underline font-semibold text-sm">Esqueceu a senha?</a>
          </div>
          <button class="w-full py-3 bg-yellow-400 text-purple-900 font-bold rounded-full hover:bg-yellow-300">Entrar</button>
        </form>
        <p class="mt-6 text-sm text-white">Ainda não tem uma conta? <button onclick="flipCard()" class="text-yellow-400 hover:underline font-semibold">Cadastrar</button></p>
      </div>

      <div class="card-face card-back glass absolute w-full h-full rounded-3xl flex flex-col items-center justify-center px-10">
        <h2 class="text-3xl font-bold text-white mb-6">Crie sua conta</h2>
        <form class="w-full space-y-4">
          <input type="text" placeholder="Nome completo" class="w-full px-4 py-3 rounded-xl border border-purple-300 focus:ring-2 focus:ring-yellow-400 outline-none bg-white bg-opacity-10 text-white placeholder-gray-300" />
          <input type="email" placeholder="E-mail" class="w-full px-4 py-3 rounded-xl border border-purple-300 focus:ring-2 focus:ring-yellow-400 outline-none bg-white bg-opacity-10 text-white placeholder-gray-300" />
          <input type="password" placeholder="Senha" class="w-full px-4 py-3 rounded-xl border border-purple-300 focus:ring-2 focus:ring-yellow-400 outline-none bg-white bg-opacity-10 text-white placeholder-gray-300" />
          <button class="w-full py-3 bg-yellow-400 text-purple-900 font-bold rounded-full hover:bg-yellow-300">Cadastrar</button>
        </form>
        <p class="mt-6 text-sm text-white">Já tem uma conta? <button onclick="flipCard()" class="text-yellow-400 hover:underline font-semibold">Entrar</button></p>
      </div>

    </div>
  </div>

  <script>
    const card = document.getElementById("card");
    function flipCard() {
      card.classList.toggle("flipped");
    }
  </script>

</body>
</html>
